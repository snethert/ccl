<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">IDE Variation 3 - Systems View</title>
  <desc id="desc">Instrument-wall layout combining editor, inspector, runtime timeline, and repl with command-first navigation.</desc>
  <defs>
    <style>
      .ui { font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; }
      .mono { font-family: Iosevka, "SFMono-Regular", Consolas, Menlo, monospace; }
      .p { fill: #e8e8e8; }
      .s { fill: #b8b8b8; }
      .m { fill: #8a8a8a; }
      .a { fill: #6fb0ff; }
      .err { fill: #f06b6b; }
      .ok { fill: #6ccf8f; }
      .warn { fill: #f0b35b; }
    </style>
    <filter id="e2"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/></filter>
  </defs>

  <rect width="1440" height="900" fill="#121212"/>
  <rect x="0" y="0" width="1440" height="52" fill="#1b1b1b" stroke="#676767"/>
  <text class="ui p" x="18" y="31" font-size="15" font-weight="600">Web Lisp IDE</text>
  <text class="ui s" x="150" y="31" font-size="13">worldlet: runtime-lab / profile: instrument-first</text>
  <rect x="900" y="11" width="522" height="30" rx="4" fill="#0f0f0f" stroke="#4a4a4a"/>
  <text class="ui m" x="912" y="31" font-size="12">Cmd Palette: "inspect stop", "open profiler", "trace emit-op", "jump to warning"</text>

  <!-- Left thin nav rail -->
  <g filter="url(#e2)">
    <rect x="12" y="64" width="176" height="824" rx="8" fill="#1b1b1b" stroke="#676767"/>
  </g>
  <text class="ui p" x="24" y="90" font-size="13" font-weight="600">Instruments</text>
  <line x1="24" y1="100" x2="176" y2="100" stroke="#4a4a4a"/>
  <rect x="24" y="114" width="152" height="30" rx="4" fill="#2b4870" stroke="#929292"/>
  <text class="ui" x="36" y="134" font-size="12" fill="#f2f6ff">Editor</text>
  <rect x="24" y="150" width="152" height="30" rx="4" fill="#232323" stroke="#4a4a4a"/>
  <text class="ui s" x="36" y="170" font-size="12">Inspector</text>
  <rect x="24" y="186" width="152" height="30" rx="4" fill="#232323" stroke="#4a4a4a"/>
  <text class="ui s" x="36" y="206" font-size="12">Debugger</text>
  <rect x="24" y="222" width="152" height="30" rx="4" fill="#232323" stroke="#4a4a4a"/>
  <text class="ui s" x="36" y="242" font-size="12">Profiler</text>
  <rect x="24" y="258" width="152" height="30" rx="4" fill="#232323" stroke="#4a4a4a"/>
  <text class="ui s" x="36" y="278" font-size="12">REPL</text>

  <text class="ui p" x="24" y="330" font-size="13" font-weight="600">Status</text>
  <line x1="24" y1="340" x2="176" y2="340" stroke="#4a4a4a"/>
  <text class="ui ok" x="24" y="364" font-size="12">kernel-free lane: pass</text>
  <text class="ui warn" x="24" y="384" font-size="12">kernel-full lane: blocked</text>
  <text class="ui err" x="24" y="404" font-size="12">2 runtime warnings</text>

  <!-- Main canvas grid area -->
  <!-- Top-left editor -->
  <g filter="url(#e2)">
    <rect x="200" y="64" width="690" height="412" rx="8" fill="#1b1b1b" stroke="#676767"/>
  </g>
  <rect x="201" y="65" width="688" height="34" rx="8" fill="#232323"/>
  <rect x="199" y="63" width="694" height="416" rx="9" fill="none" stroke="#a7c8ff" stroke-width="2"/>
  <text class="ui p" x="216" y="87" font-size="13" font-weight="600">Editor</text>
  <text class="ui m" x="280" y="87" font-size="12">compiler.lisp | defun emit-op</text>

  <rect x="216" y="112" width="658" height="348" rx="4" fill="#0f0f0f" stroke="#4a4a4a"/>
  <rect x="216" y="112" width="42" height="348" fill="#151515"/>
  <text class="mono m" x="226" y="136" font-size="11">118</text>
  <text class="mono m" x="226" y="156" font-size="11">119</text>
  <text class="mono m" x="226" y="176" font-size="11">120</text>
  <text class="mono m" x="226" y="196" font-size="11">121</text>
  <rect x="258" y="164" width="616" height="20" fill="#232323"/>
  <text class="mono s" x="266" y="136" font-size="12">(defun emit-op (ctx op args)</text>
  <text class="mono s" x="266" y="156" font-size="12">  (let ((anchor (resolve-anchor ...))</text>
  <text class="mono p" x="266" y="176" font-size="12">        (result (dispatch-op op args)))</text>
  <text class="mono s" x="266" y="196" font-size="12">    (runtime.debugger.breakpoint.upsert ...)</text>

  <!-- Top-right inspector -->
  <g filter="url(#e2)">
    <rect x="902" y="64" width="526" height="412" rx="8" fill="#1b1b1b" stroke="#676767"/>
  </g>
  <rect x="903" y="65" width="524" height="34" rx="8" fill="#232323"/>
  <text class="ui p" x="918" y="87" font-size="13" font-weight="600">Inspector + Object Graph</text>

  <rect x="918" y="112" width="496" height="348" rx="4" fill="#0f0f0f" stroke="#4a4a4a"/>
  <text class="mono s" x="932" y="136" font-size="12">selection: #&lt;BREAKPOINT-ACK bp-17&gt;</text>
  <text class="mono s" x="932" y="156" font-size="12">source: compiler.lisp:120 | frame: emit-op</text>
  <text class="ui p" x="932" y="186" font-size="12" font-weight="600">Graph Lens</text>
  <rect x="932" y="196" width="300" height="120" rx="4" fill="#151515" stroke="#4a4a4a"/>
  <circle cx="970" cy="236" r="18" fill="#2b4870" stroke="#929292"/>
  <text class="ui" x="960" y="240" font-size="10" fill="#f2f6ff">ACK</text>
  <circle cx="1060" cy="216" r="16" fill="#232323" stroke="#676767"/>
  <text class="ui s" x="1052" y="220" font-size="10">SRC</text>
  <circle cx="1060" cy="260" r="16" fill="#232323" stroke="#676767"/>
  <text class="ui s" x="1050" y="264" font-size="10">FRM</text>
  <line x1="988" y1="230" x2="1044" y2="218" stroke="#6fb0ff"/>
  <line x1="988" y1="242" x2="1044" y2="256" stroke="#6fb0ff"/>

  <text class="ui p" x="932" y="346" font-size="12" font-weight="600">Quick Actions</text>
  <rect x="932" y="356" width="132" height="28" rx="4" fill="#232323" stroke="#676767"/>
  <text class="ui p" x="948" y="374" font-size="12">Inspect Parent</text>
  <rect x="1072" y="356" width="106" height="28" rx="4" fill="#232323" stroke="#676767"/>
  <text class="ui p" x="1092" y="374" font-size="12">Pin Watch</text>
  <rect x="1186" y="356" width="120" height="28" rx="4" fill="#232323" stroke="#676767"/>
  <text class="ui p" x="1204" y="374" font-size="12">Jump Source</text>

  <!-- Bottom-left runtime timeline/profiler -->
  <g filter="url(#e2)">
    <rect x="200" y="488" width="690" height="400" rx="8" fill="#1b1b1b" stroke="#676767"/>
  </g>
  <rect x="201" y="489" width="688" height="34" rx="8" fill="#232323"/>
  <text class="ui p" x="216" y="511" font-size="13" font-weight="600">Runtime Timeline + Profiler</text>

  <rect x="216" y="536" width="658" height="336" rx="4" fill="#0f0f0f" stroke="#4a4a4a"/>
  <line x1="236" y1="822" x2="854" y2="822" stroke="#4a4a4a"/>
  <line x1="236" y1="582" x2="236" y2="822" stroke="#4a4a4a"/>
  <polyline points="246,792 300,774 356,782 412,736 468,742 524,680 580,688 636,642 692,650 748,612 804,620" fill="none" stroke="#6fb0ff" stroke-width="2"/>
  <polyline points="246,812 300,804 356,808 412,790 468,792 524,770 580,772 636,748 692,750 748,732 804,734" fill="none" stroke="#6ccf8f" stroke-width="2"/>
  <text class="ui s" x="248" y="566" font-size="11">latency ms</text>
  <text class="ui s" x="780" y="838" font-size="11">time</text>
  <rect x="248" y="844" width="12" height="12" fill="#6fb0ff"/><text class="ui s" x="266" y="854" font-size="11">command latency</text>
  <rect x="392" y="844" width="12" height="12" fill="#6ccf8f"/><text class="ui s" x="410" y="854" font-size="11">gc pause</text>

  <!-- Bottom-right repl + debugger summary -->
  <g filter="url(#e2)">
    <rect x="902" y="488" width="526" height="400" rx="8" fill="#1b1b1b" stroke="#676767"/>
  </g>
  <rect x="903" y="489" width="524" height="34" rx="8" fill="#232323"/>
  <text class="ui p" x="918" y="511" font-size="13" font-weight="600">REPL + Debug Summary</text>

  <rect x="918" y="536" width="496" height="220" rx="4" fill="#0f0f0f" stroke="#4a4a4a"/>
  <text class="mono s" x="932" y="560" font-size="12">CL-USER&gt; (trace emit-op)</text>
  <text class="mono ok" x="932" y="580" font-size="12">; tracing enabled</text>
  <text class="mono s" x="932" y="600" font-size="12">CL-USER&gt; (emit-op *ctx* 'call '(x y))</text>
  <text class="mono err" x="932" y="620" font-size="12">; debugger stop at compiler.lisp:120</text>
  <text class="mono s" x="932" y="640" font-size="12">CL-USER&gt; (invoke-restart 're-resolve-source-revision)</text>
  <text class="mono ok" x="932" y="660" font-size="12">; resumed with mapping epoch 94</text>

  <rect x="918" y="770" width="496" height="102" rx="4" fill="#0f0f0f" stroke="#4a4a4a"/>
  <text class="ui p" x="932" y="792" font-size="12" font-weight="600">Debugger Snapshot</text>
  <text class="ui s" x="932" y="812" font-size="12">active frame: emit-op | restart options: 3 | slide-points: 2</text>
  <rect x="932" y="824" width="116" height="30" rx="4" fill="#232323" stroke="#676767"/>
  <text class="ui p" x="948" y="844" font-size="12">Open Debugger</text>
  <rect x="1056" y="824" width="122" height="30" rx="4" fill="#232323" stroke="#676767"/>
  <text class="ui p" x="1072" y="844" font-size="12">Step Over</text>
  <rect x="1186" y="824" width="140" height="30" rx="4" fill="#232323" stroke="#676767"/>
  <text class="ui p" x="1204" y="844" font-size="12">Restart: Resolve</text>
</svg>
